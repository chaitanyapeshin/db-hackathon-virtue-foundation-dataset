<text x="40" y="50" font-size="24" font-weight="700" fill="#0f172a">Medium tier: access, crowding and a score you can audit</text>
<text x="40" y="76" font-size="15" fill="#64748b">When days matter more than minutes, reliability, capacity and repeat travel decide. The weights are shown, then stress-tested.</text>
