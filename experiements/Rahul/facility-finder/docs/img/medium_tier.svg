<rect x="217" y="247" width="26" height="26" rx="6" fill="#d97706"/>
<text x="230" y="265" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">+</text>
<text x="250" y="244" font-size="13" font-weight="700" fill="#92400e" text-anchor="start">150 beds</text>
<rect x="407" y="367" width="26" height="26" rx="6" fill="#d97706"/>
<text x="420" y="385" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">+</text>
<text x="440" y="364" font-size="13" font-weight="700" fill="#92400e" text-anchor="start">20 beds</text>
<circle cx="330" cy="330" r="9" fill="#0f172a"/>
<text x="344" y="334" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">you</text>
<text x="60" y="500" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">grey dots = places (sized by population) · dashed = 60 km catchment</text>
<text x="600" y="130" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">1 · Access (E2SFCA)</text>
<text x="600" y="151" font-size="14" font-weight="400" fill="#475569" text-anchor="start">each facility’s supply ÷ demand in reach; you get an access percentile</text>
<text x="600" y="192" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">2 · Crowding (Huff model)</text>
<text x="600" y="213" font-size="14" font-weight="400" fill="#475569" text-anchor="start">who will likely go where → expected patients per bed</text>
<text x="600" y="254" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">3 · Weighted score</text>
<text x="600" y="275" font-size="14" font-weight="400" fill="#475569" text-anchor="start">six criteria with explicit weights:</text>
<rect x="600" y="290" width="159" height="34" rx="6" fill="#2563eb"/>
<text x="681.0" y="312" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">0.30</text>
<rect x="762" y="290" width="105" height="34" rx="6" fill="#0d9488"/>
<text x="816.0" y="312" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">0.20</text>
<rect x="870" y="290" width="105" height="34" rx="6" fill="#7c3aed"/>
<text x="924.0" y="312" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">0.20</text>
<rect x="978" y="290" width="51" height="34" rx="6" fill="#d97706"/>
<text x="1005.0" y="312" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">0.10</text>
<rect x="1032" y="290" width="51" height="34" rx="6" fill="#64748b"/>
<text x="1059.0" y="312" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">0.10</text>
<rect x="1086" y="290" width="51" height="34" rx="6" fill="#db2777"/>
<text x="1113.0" y="312" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">0.10</text>
<rect x="600" y="332" width="11" height="11" rx="2" fill="#2563eb"/>
<text x="615" y="342" font-size="12" font-weight="600" fill="#334155" text-anchor="start">validity</text>
<rect x="685" y="332" width="11" height="11" rx="2" fill="#0d9488"/>
<text x="700" y="342" font-size="12" font-weight="600" fill="#334155" text-anchor="start">travel</text>
<rect x="756" y="332" width="11" height="11" rx="2" fill="#7c3aed"/>
<text x="771" y="342" font-size="12" font-weight="600" fill="#334155" text-anchor="start">quality</text>
<rect x="834" y="332" width="11" height="11" rx="2" fill="#d97706"/>
<text x="849" y="342" font-size="12" font-weight="600" fill="#334155" text-anchor="start">credibility</text>
<rect x="940" y="332" width="11" height="11" rx="2" fill="#64748b"/>
<text x="955" y="342" font-size="12" font-weight="600" fill="#334155" text-anchor="start">low crowding</text>
<rect x="1053" y="332" width="11" height="11" rx="2" fill="#db2777"/>
<text x="1068" y="342" font-size="12" font-weight="600" fill="#334155" text-anchor="start">affordability</text>
<text x="600" y="388" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">4 · Is the ranking fragile?</text>
<text x="600" y="409" font-size="14" font-weight="400" fill="#475569" text-anchor="start">1,000 random weightings (Dirichlet), e.g. “stays #1 in 84% of them”</text>
<text x="600" y="450" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">5 · Pareto check + district need (NFHS)</text>
<text x="600" y="471" font-size="14" font-weight="400" fill="#475569" text-anchor="start">is anything better on every criterion? is this a care desert?</text>
</svg>