<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect x="1" y="1" width="1198" height="518" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="40" y="50" font-size="24" font-weight="700" fill="#0f172a">Location validity: is the map pin where the address says?</text>
<text x="40" y="76" font-size="15" fill="#64748b">Stated coordinates are compared with the centre of the facility’s own PIN code, scaled by how big that PIN area is.</text>
<circle cx="330" cy="310" r="195" fill="#fee2e2" stroke="#ffffff" stroke-width="3"/>
<circle cx="330" cy="310" r="150" fill="#fef3c7" stroke="#ffffff" stroke-width="3"/>
<circle cx="330" cy="310" r="95" fill="#dcfce7" stroke="#ffffff" stroke-width="3"/>
<circle cx="330" cy="310" r="45" fill="#bbf7d0" stroke="#ffffff" stroke-width="3"/>
<circle cx="330" cy="310" r="5" fill="#0f172a"/>
<text x="330" y="332" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">PIN centre</text>
<text x="330" y="288" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">≤ 1× radius → 0.95</text>
<text x="330" y="238" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">≤ 3× → 0.75</text>
<text x="330" y="188" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">≤ 10× → 0.35</text>
<text x="330" y="140" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">further → 0.10</text>
<path d="M268,372 l-9,-18 a10,10 0 1,1 18,0 z" fill="#0d9488"/>
<text x="268" y="392" font-size="13" font-weight="600" fill="#0f766e" text-anchor="middle">pin agrees</text>
<path d="M470,435 l-9,-18 a10,10 0 1,1 18,0 z" fill="#dc2626"/>
<text x="470" y="455" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle">pin contradicts its PIN</text>
<text x="620" y="150" font-size="24" font-weight="700" fill="#dc2626" text-anchor="start">19.25%</text>
<text x="620" y="174" font-size="15" font-weight="400" fill="#475569" text-anchor="start">of listings have coordinates that contradict their own PIN code</text>
<text x="620" y="232" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Kept, but made uncertain</text>
<text x="620" y="256" font-size="15" font-weight="400" fill="#475569" text-anchor="start">a doubtful facility is not deleted; its position becomes a probability</text>
<text x="620" y="314" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start">Used by the High tier</text>
<text x="620" y="338" font-size="15" font-weight="400" fill="#475569" text-anchor="start">every simulated world draws where the facility really is:</text>
<text x="636" y="368" font-size="14" font-weight="400" fill="#334155" text-anchor="start">• with probability P: at the stated pin (± 0.3 km)</text>
<text x="636" y="390" font-size="14" font-weight="400" fill="#334155" text-anchor="start">• otherwise: somewhere around its PIN centre</text>
<text x="620" y="436" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">The user’s location gets the same treatment: “Jaipur” is a cloud of post-office</text>
<text x="620" y="456" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">points, a 6-digit PIN is a small cloud, and “lat,lon” is a single point.</text>
</svg>