command: ["streamlit", "run", "app.py"]
env:
  - name: "DATABRICKS_WAREHOUSE_ID"
    valueFrom: "sql-warehouse"          # resource key of the SQL warehouse you attach to the app
  - name: "CARECOMPASS_TABLES"
    value: "workspace.care_compass"
  - name: "STREAMLIT_BROWSER_GATHER_USAGE_STATS"
    value: "false"
